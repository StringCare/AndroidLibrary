name: Task - Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'
      title:
        description: 'Title'
        required: true
        default: 'New Version'
      changelog:
        description: 'Changelog'
        required: true
        default: '- Several improvements'
      issue:
        description: 'Launcher issue'
        required: true
        default: '-1'
      publish_maven:
        description: 'Publish library to Sonatype (requires NEXUS_USERNAME, NEXUS_PASSWORD, signing keys); set to true to run'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-version-files:
    name: Prepare files for release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate inputs
        env:
          VERSION: ${{ github.event.inputs.version }}
          ISSUE: ${{ github.event.inputs.issue }}
          TITLE: ${{ github.event.inputs.title }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          err=0
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in semver format (e.g. 1.0.0)."
            err=1
          fi
          if ! [[ "$ISSUE" =~ ^-?[0-9]+$ ]]; then
            echo "::error::Issue must be a number (e.g. 123 or -1)."
            err=1
          fi
          if [[ ${#TITLE} -gt 1000 ]]; then
            echo "::error::Title must be at most 1000 characters."
            err=1
          fi
          if [[ ${#CHANGELOG} -gt 50000 ]]; then
            echo "::error::Changelog must be at most 50000 characters."
            err=1
          fi
          [[ $err -eq 0 ]] || exit 1

      - name: Update VERSION_NAME in gradle.properties
        run: |
          sed -i.bak "s/^VERSION_NAME=.*/VERSION_NAME=${{ github.event.inputs.version }}/" gradle.properties
          cat gradle.properties | grep VERSION_NAME

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all modules
        run: ./gradlew clean build --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Commit version bump
        uses: EndBug/add-and-commit@v9
        with:
          add: 'gradle.properties'
          committer_name: GitHub Actions
          committer_email: actions@github.com
          default_author: user_info
          message: 'chore: bump version to ${{ github.event.inputs.version }} (release)'

  publish:
    name: Publish to Maven
    runs-on: ubuntu-latest
    needs: [ prepare-version-files ]
    # Enable when secrets NEXUS_USERNAME, NEXUS_PASSWORD (and signing keys) are set; then set publish_maven to true in workflow_dispatch
    if: ${{ github.event.inputs.publish_maven == 'true' }}
    env:
      VERSION_NAME: ${{ github.event.inputs.version }}
      ORG_GRADLE_PROJECT_nexusUsername: ${{ secrets.NEXUS_USERNAME }}
      ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish library to Sonatype
        run: ./gradlew :library:publishReleasePublicationToSonatypeRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_nexusUsername: ${{ secrets.NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.NEXUS_PASSWORD }}

  tag:
    name: Publish version
    runs-on: ubuntu-latest
    needs: [ prepare-version-files ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Copilot - Create Tag
        uses: vypdev/copilot@v2
        if: ${{ success() }}
        with:
          debug: ${{ vars.DEBUG }}
          single-action: 'create_tag'
          single-action-issue: '${{ github.event.inputs.issue }}'
          single-action-version: '${{ github.event.inputs.version }}'
          token: ${{ secrets.PAT }}
  
      - name: Copilot - Create Release
        uses: vypdev/copilot@v2
        if: ${{ success() }}
        with:
          debug: ${{ vars.DEBUG }}
          single-action: 'create_release'
          single-action-issue: '${{ github.event.inputs.issue }}'
          single-action-version: '${{ github.event.inputs.version }}'
          single-action-title: '${{ github.event.inputs.title }}'
          single-action-changelog: '${{ github.event.inputs.changelog }}'
          token: ${{ secrets.PAT }}

      # Example: generic step to perform the deployment (uncomment and adjust as needed)
      # - name: Generic step
      #   uses: whatever/action@v2 

      - name: Copilot - Deploy success notification
        uses: vypdev/copilot@v2
        if: ${{ success() }}
        with:
          debug: ${{ vars.DEBUG }}
          single-action: 'deployed_action'
          single-action-issue: '${{ github.event.inputs.issue }}'
          opencode-model: ${{ vars.OPENCODE_MODEL }}
          token: ${{ secrets.PAT }}
